name: Deploy Preprod

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/magic-systeme-preprod
            git pull origin main
            npm install
            npx prisma generate
            npm run build
            pm2 restart magic-systeme-preprod
            pm2 save
